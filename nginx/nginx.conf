events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        client_max_body_size 20m;

        # There is deliberately NO public location for the WhatsApp gateway.
        #
        # The previous /wa-bridge/ proxy exposed the whole bridge API to the
        # internet with no authentication: /send-message could send as the
        # business, /contacts dumped the customer address book, and /qr returned a
        # live linking QR that anyone could scan to attach their own device to the
        # WhatsApp account.
        #
        # The gateway (openwa:2785) is now reachable only on the container
        # network. The single thing a browser needs, the linking QR, is fetched
        # server-side by Flask and re-served from /whatsapp/qr/<session> behind an
        # admin login. To reach the gateway's own dashboard, publish its port and
        # tunnel: ssh -L 2785:127.0.0.1:2785 <host>
        #
        # Static upstreams (no variable/resolver) so name resolution happens at
        # startup via /etc/hosts + resolv.conf, which works on both Docker and
        # podman. The variable+`resolver 127.0.0.11` form is Docker-only and 502s
        # on podman (no DNS server at 127.0.0.11). Consequence worth knowing:
        # nginx refuses to boot when a name referenced here does not resolve, so
        # anything named below must be a running compose service.

        # Flask app (dashboard, bookings, settings, API).
        location / {
            proxy_pass http://web:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
