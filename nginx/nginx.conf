events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        client_max_body_size 20m;

        # WhatsApp bridge (QR image, pairing, status). Proxied under /wa-bridge/
        # so the whole app is reachable through this single public port;
        # wa-bridge:3000 itself only resolves inside the container network, not
        # from a browser on the host.
        # Static upstreams (no variable/resolver) so name resolution happens at
        # startup via /etc/hosts + resolv.conf, which works on both Docker and
        # podman. The variable+`resolver 127.0.0.11` form is Docker-only and 502s
        # on podman (no DNS server at 127.0.0.11).
        location /wa-bridge/ {
            rewrite ^/wa-bridge/?(.*)$ /$1 break;
            proxy_pass http://wa-bridge:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask app (dashboard, bookings, settings, API).
        location / {
            proxy_pass http://web:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
