events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        client_max_body_size 20m;

        # WhatsApp bridge (QR image, pairing, status). Proxied under /wa-bridge/
        # so the whole app is reachable through this single public port;
        # wa-bridge:3000 itself only resolves inside the Docker network, not
        # from a browser on the host.
        location /wa-bridge/ {
            proxy_pass http://wa-bridge:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask app (dashboard, bookings, settings, API).
        location / {
            proxy_pass http://web:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
