events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off;

    server {
        listen 80;

        client_max_body_size 20m;

        # WhatsApp bridge (QR image, pairing, status). Proxied under /wa-bridge/
        # so the whole app is reachable through this single public port;
        # wa-bridge:3000 itself only resolves inside the Docker network, not
        # from a browser on the host.
        location /wa-bridge/ {
            set $wa_bridge_upstream http://wa-bridge:3000;
            rewrite ^/wa-bridge/?(.*)$ /$1 break;
            proxy_pass $wa_bridge_upstream$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask app (dashboard, bookings, settings, API).
        location / {
            set $web_upstream http://web:5000;
            proxy_pass $web_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
