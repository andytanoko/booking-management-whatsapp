{% extends 'base.html' %}
{% from '_icons.html' import icon %}
{% block content %}
<section class="card card-narrow">
  <div class="card-header">{{ icon('lock') }}<h2>Masuk Sistem</h2></div>
  <p>Login sebagai Admin, CS, atau Technician.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" class="form-grid">
    <label>Username
      <input type="text" name="username" required />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <button type="submit">{{ icon('log-in') }} Login</button>
  </form>
  <small>Akun awal: admin/admin123, cs1/cs123, tech1/tech123</small>
</section>
{% endblock %}
