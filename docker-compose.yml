services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@db:5432/${POSTGRES_DB:-booking}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./:/app

  wa-bridge:
    build: ./tools/wa-real-bridge
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      BRIDGE_PORT: 3000
      # Service name on the compose network, not localhost.
      APP_WEBHOOK_URL: http://web:5000/api/whatsapp/inbound
      FORWARD_GROUPS: ${FORWARD_GROUPS:-false}
      # Only set to "true" behind a corporate TLS-intercepting proxy (e.g.
      # Netskope) where the intercepting CA can't otherwise be trusted by
      # Chromium. Leave unset in production.
      WA_BRIDGE_IGNORE_CERT_ERRORS: ${WA_BRIDGE_IGNORE_CERT_ERRORS:-false}
    depends_on:
      - web
    volumes:
      # Bind-mount so .wwebjs_auth/.wwebjs_cache/instances.json survive restarts;
      # node_modules gets its own volume so the host bind mount doesn't shadow it.
      - ./tools/wa-real-bridge:/usr/src/app
      - wa_bridge_node_modules:/usr/src/app/node_modules

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - wa-bridge

volumes:
  pgdata:
  wa_bridge_node_modules:
